<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#f7f8f4"><meta name="color-scheme" content="light">
  <meta name="description" content="Dein persönlicher Plan: Zahlungen, Lohn und Kontostand von 2027 bis 2080 einfach planen.">
  <title>Mein Plan</title><link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar"><a class="brand" href="#overview" aria-label="Mein Plan, Übersicht"><span class="brand-symbol" aria-hidden="true">m.</span><span class="brand-copy">Mein Plan<b>Zahlungen im Blick</b></span></a><div class="header-actions"><button id="lock-budget" type="button" class="button quiet small" hidden>Sperren</button><span id="save-status" class="save-status" role="status">Wird geladen …</span></div></header>
  <main id="app"><p class="loading">Dein Plan wird geladen …</p></main>
  <nav hidden class="bottom-nav" aria-label="Hauptnavigation">
    <a href="#overview" data-view="overview"><span aria-hidden="true">◫</span>Übersicht</a>
    <a href="#edit" data-view="edit"><span aria-hidden="true">≡</span>Einträge</a>
    <a href="#year" data-view="year"><span aria-hidden="true">▦</span>Jahr</a>
    <a href="#backup" data-view="backup"><span aria-hidden="true">↥</span>Sichern</a>
  </nav>
  <dialog id="editor" aria-labelledby="edit-title">
    <form id="edit-form" novalidate>
      <div class="dialog-top"><span class="eyebrow" id="edit-category"></span><button type="button" class="icon-button" id="close-editor" aria-label="Schliessen">×</button></div>
      <h2 id="edit-title"></h2><p id="edit-note" class="muted"></p>
      <div id="editor-fields"></div><p id="edit-error" class="error" role="alert"></p>
      <div class="dialog-actions"><button type="submit" class="button primary" id="save-item">Übernehmen</button><button type="button" class="button quiet" id="skip-item" hidden>Später beantworten</button></div>
      <div id="editor-secondary"></div>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <script type="module" src="app.mjs"></script>
</body>
</html>
